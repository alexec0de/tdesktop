name: Windows ARM64

# ARM64 запускаю только вручную или при релизе — на каждый push 6 часов
# GH-hosted ARM-runner'а тратить смысла нет.
on:
  workflow_dispatch:
  release:
    types: [created]

jobs:
  windows-arm64:
    name: Windows arm64 build
    # GitHub предоставляет нативный ARM-раннер windows-11-arm.
    # Своей ARM-машины под self-host у нас нет.
    runs-on: windows-11-arm
    timeout-minutes: 360

    env:
      ARCH: arm64
      ARCH_LABEL: arm64
      LIBS_SUBDIR: ''
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"

    defaults:
      run:
        shell: cmd

    steps:
      - name: Prepare directories.
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries${{ env.LIBS_SUBDIR }}>>%GITHUB_ENV%

      - name: Get repository name.
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Clone.
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      - name: Apply Opengram RSA public key.
        shell: bash
        env:
          OPENGRAM_PUBKEY: ${{ secrets.OPENGRAM_PUBKEY }}
        run: |
          cd "$TBUILD/$REPO_NAME"
          if [ -z "$OPENGRAM_PUBKEY" ]; then
            echo "::warning::OPENGRAM_PUBKEY secret is not set — build won't connect to the server."
          else
            printf '%s\n' "$OPENGRAM_PUBKEY" > pubkey.asc
            python _apply_pubkey.py
            echo "Public key applied."
          fi

      - name: Read SDK version.
        shell: bash
        run: |
          DOCPATH=$TBUILD/$REPO_NAME/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV

          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake

          echo "$(sha256sum $TBUILD/$REPO_NAME/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

          git config --global user.email "ci@opengra.me"
          git config --global user.name "Opengram CI"

      - uses: ilammy/msvc-dev-cmd@v1
        name: Native Tools Command Prompt.
        with:
          arch: arm64
          sdk: ${{ env.SDK }}

      - name: Locate Visual Studio for gyp.
        # windows-latest переехал с VS 2022 на VS 2026 (каталог ...\18\...),
        # поэтому жёстко прописанный путь к 2022\Enterprise ломал gyp в
        # breakpad ("vcvarsall.bat is missing"). Ищу установку через vswhere
        # и отдаю gyp фактический путь и версию.
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsPath = & $vswhere -latest -products * -prerelease -property installationPath
          $vsMajor = (& $vswhere -latest -products * -prerelease -property installationVersion).Split('.')[0]
          if (-not $vsPath -or -not (Test-Path (Join-Path $vsPath 'VC\Auxiliary\Build\vcvarsall.bat'))) {
            Write-Host "::error::Visual Studio with VC++ tools not found (vswhere: '$vsPath')"
            exit 1
          }
          $gypVersion = switch ($vsMajor) {
            '18' { '2026' }
            '17' { '2022' }
            default { Write-Host "::error::Unsupported Visual Studio major version $vsMajor"; exit 1 }
          }
          Write-Host "Visual Studio $gypVersion at $vsPath"
          "GYP_MSVS_OVERRIDE_PATH=$vsPath\" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "GYP_MSVS_VERSION=$gypVersion"   | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: ThirdParty cache.
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-arm64-third-party-${{ env.CACHE_KEY }}
          restore-keys: |
            ${{ runner.OS }}-arm64-third-party-${{ env.CACHE_KEY }}-
            ${{ runner.OS }}-arm64-third-party-

      - name: Libraries cache.
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-arm64-libs-${{ env.CACHE_KEY }}
          restore-keys: |
            ${{ runner.OS }}-arm64-libs-${{ env.CACHE_KEY }}-
            ${{ runner.OS }}-arm64-libs-

      - name: Qt cache.
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-arm64-qt6-${{ env.CACHE_KEY }}
          restore-keys: |
            ${{ runner.OS }}-arm64-qt6-${{ env.CACHE_KEY }}-
            ${{ runner.OS }}-arm64-qt6-

      - name: Snapshot prepare cache keys.
        # prepare.py пишет cache_keys\<stage> только после успешной сборки
        # стадии. Запоминаю их до prepare, чтобы потом сохранять кэш только
        # если что-то реально дособралось.
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'cache-keys-before'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          function Get-Keys($dir, [scriptblock]$filter) {
            if (-not (Test-Path $dir)) { return '' }
            (Get-ChildItem -LiteralPath $dir -File | Where-Object $filter | Sort-Object Name |
              ForEach-Object { $_.Name + '=' + (Get-Content -Raw -LiteralPath $_.FullName) }) -join ';'
          }
          $tp = Join-Path $env:TBUILD 'ThirdParty\cache_keys'
          $lib = Join-Path $env:LibrariesPath 'cache_keys'
          Get-Keys $tp { $true }                          | Set-Content (Join-Path $out 'third_party')
          Get-Keys $lib { $_.Name -notmatch '^[qQ]t[_-]' } | Set-Content (Join-Path $out 'libs')
          Get-Keys $lib { $_.Name -match '^[qQ]t[_-]' }    | Set-Content (Join-Path $out 'qt')

      - name: Libraries.
        run: |
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat silent qt6

      - name: Disable Qt 6.11 strict overflow asserts.
        # Qt 6.11 хардкодит Q_ASSERT_X в QCheckedInt::operator+ — мьютю
        # макрос через push/pop_macro в qcheckedint_impl.h, иначе emoji-
        # picker и пр. падают __fastfail'ом. См. windows.yml для деталей.
        shell: pwsh
        run: |
          $hdr = Get-ChildItem -Path "$env:LibrariesPath" -Recurse -Filter qcheckedint_impl.h `
              -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $hdr) {
            Write-Host "::warning::qcheckedint_impl.h not found under $env:LibrariesPath — Qt 6.11 layout may have changed, skipping patch"
          } else {
            $marker = '/* opengram-overflow-asserts-disabled */'
            $content = Get-Content -Raw -LiteralPath $hdr.FullName
            if ($content.Contains($marker)) {
              Write-Host "Header already patched at $($hdr.FullName) — skipping"
            } else {
              $nl = "`r`n"
              $prefix = ($marker,
                '// Qt 6.11 fires Q_ASSERT_X from QCheckedInt::operator+ / -*''s body',
                '// directly — even when the IgnoreOverflowPolicy template arg is chosen.',
                '// Mute the assert macros for the duration of this header so the int',
                '// arithmetic overflows silently like it did in Qt <= 6.10.',
                '#pragma push_macro("Q_ASSERT_X")',
                '#pragma push_macro("Q_ASSERT")',
                '#undef Q_ASSERT_X',
                '#undef Q_ASSERT',
                '#define Q_ASSERT_X(cond, where, what) ((void)0)',
                '#define Q_ASSERT(cond) ((void)0)') -join $nl
              $suffix = ('',
                '#pragma pop_macro("Q_ASSERT")',
                '#pragma pop_macro("Q_ASSERT_X")') -join $nl
              $patched = $prefix + $nl + $content + $nl + $suffix
              Set-Content -NoNewline -LiteralPath $hdr.FullName -Value $patched
              Write-Host "Patched $($hdr.FullName)"
            }
          }

      - name: Detect prepare cache changes.
        # Кэш сохраняется отдельными шагами с if: always(), а не post-шагом
        # actions/cache: тот сохраняет только при успехе всего job, и после
        # падения prepare следующий запуск собирал всё заново.
        id: cache_changes
        if: always()
        shell: pwsh
        run: |
          $before = Join-Path $env:RUNNER_TEMP 'cache-keys-before'
          function Get-Keys($dir, [scriptblock]$filter) {
            if (-not (Test-Path $dir)) { return '' }
            (Get-ChildItem -LiteralPath $dir -File | Where-Object $filter | Sort-Object Name |
              ForEach-Object { $_.Name + '=' + (Get-Content -Raw -LiteralPath $_.FullName) }) -join ';'
          }
          if (-not $env:TBUILD -or -not $env:LibrariesPath -or -not (Test-Path $before)) {
            Write-Host "prepare did not run, nothing to save"
            exit 0
          }
          $tp = Join-Path $env:TBUILD 'ThirdParty\cache_keys'
          $lib = Join-Path $env:LibrariesPath 'cache_keys'
          $now = @{
            third_party = Get-Keys $tp { $true }
            libs        = Get-Keys $lib { $_.Name -notmatch '^[qQ]t[_-]' }
            qt          = Get-Keys $lib { $_.Name -match '^[qQ]t[_-]' }
          }
          foreach ($name in $now.Keys) {
            $old = (Get-Content -Raw -LiteralPath (Join-Path $before $name) -ErrorAction SilentlyContinue)
            $old = if ($old) { $old.Trim() } else { '' }
            $changed = ($now[$name] -and $now[$name] -ne $old)
            Write-Host "$name changed: $changed"
            "$name=$($changed.ToString().ToLower())" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          }

      - name: Save ThirdParty cache.
        if: always() && steps.cache_changes.outputs.third_party == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-arm64-third-party-${{ env.CACHE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save Libraries cache.
        if: always() && steps.cache_changes.outputs.libs == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-arm64-libs-${{ env.CACHE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save Qt cache.
        if: always() && steps.cache_changes.outputs.qt == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-arm64-qt6-${{ env.CACHE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Build Opengram Desktop.
        env:
          TDESKTOP_API_ID: ${{ secrets.TDESKTOP_API_ID || '17349' }}
          TDESKTOP_API_HASH: ${{ secrets.TDESKTOP_API_HASH || '344583e45741c457fe1862106095a5eb' }}
        run: |
          cd %TBUILD%\%REPO_NAME%\Telegram

          call configure.bat qt6 arm ^
          -D CMAKE_BUILD_TYPE=Release ^
          -D CMAKE_CONFIGURATION_TYPES=Release ^
          -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT= ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON ^
          -D TDESKTOP_API_ID=%TDESKTOP_API_ID% ^
          -D TDESKTOP_API_HASH=%TDESKTOP_API_HASH%

          cmake --build ..\out --config Release --parallel

      - name: Package artifact.
        run: |
          set OUT=%TBUILD%\%REPO_NAME%\out\Release
          set QTBIN=%LibrariesPath%\Qt-6.11.0\bin
          mkdir artifact
          if exist %OUT%\Opengram.exe move %OUT%\Opengram.exe artifact\
          if exist %OUT%\Telegram.exe move %OUT%\Telegram.exe artifact\Opengram.exe
          if exist %OUT%\Updater.exe move %OUT%\Updater.exe artifact\
          if exist "%QTBIN%" (
              for %%f in ("%QTBIN%\icu*.dll" "%QTBIN%\icudt*.dll" "%QTBIN%\icuin*.dll" "%QTBIN%\icuuc*.dll") do (
                  if exist "%%f" copy /Y "%%f" artifact\ >nul
              )
          )
          dir artifact

      - uses: actions/upload-artifact@v4
        name: Upload artifact.
        with:
          name: opengram-windows-arm64
          path: artifact\
          retention-days: 30

      - name: Attach to release.
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: artifact/*
